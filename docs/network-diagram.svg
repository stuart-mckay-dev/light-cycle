<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="1100" height="820" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A1A2E">Light Cycle — Network &amp; Services Diagram</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#666">MVP Architecture — Development + Production</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- ZONE: CLIENT DEVICES -->
  <!-- ══════════════════════════════════════════════════ -->
  <rect x="20" y="78" width="280" height="320" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="160" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338CA">CLIENT DEVICES</text>

  <!-- Player device 1 -->
  <rect x="50" y="112" width="100" height="76" rx="8" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="100" y="133" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">Player Device</text>
  <text x="100" y="149" text-anchor="middle" font-size="10" fill="#444">React PWA</text>
  <text x="100" y="163" text-anchor="middle" font-size="9" fill="#666">GPS + Screen</text>
  <text x="100" y="177" text-anchor="middle" font-size="9" fill="#666">Wake Lock API</text>

  <!-- Player device 2 -->
  <rect x="170" y="112" width="100" height="76" rx="8" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="220" y="133" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">Player Device</text>
  <text x="220" y="149" text-anchor="middle" font-size="10" fill="#444">React PWA</text>
  <text x="220" y="163" text-anchor="middle" font-size="9" fill="#666">GPS + Screen</text>
  <text x="220" y="177" text-anchor="middle" font-size="9" fill="#666">Wake Lock API</text>

  <!-- Mapbox GL JS note -->
  <rect x="50" y="202" width="220" height="50" rx="6" fill="#E0E7FF" stroke="#818CF8" stroke-width="1"/>
  <text x="160" y="221" text-anchor="middle" font-size="10" font-weight="bold" fill="#3730A3">Mapbox GL JS</text>
  <text x="160" y="235" text-anchor="middle" font-size="9" fill="#444">Map rendering, tile display</text>
  <text x="160" y="247" text-anchor="middle" font-size="9" fill="#444">Tail + player overlay</text>

  <!-- sessionStorage -->
  <rect x="50" y="264" width="220" height="44" rx="6" fill="#E0E7FF" stroke="#818CF8" stroke-width="1"/>
  <text x="160" y="282" text-anchor="middle" font-size="10" font-weight="bold" fill="#3730A3">sessionStorage</text>
  <text x="160" y="298" text-anchor="middle" font-size="9" fill="#444">UUID · Nickname · Color</text>

  <!-- Socket.io client note -->
  <rect x="50" y="320" width="220" height="44" rx="6" fill="#E0E7FF" stroke="#818CF8" stroke-width="1"/>
  <text x="160" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#3730A3">Socket.io Client</text>
  <text x="160" y="354" text-anchor="middle" font-size="9" fill="#444">Position emit · State receive</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- ZONE: INTERNET / CLOUDFLARE -->
  <!-- ══════════════════════════════════════════════════ -->
  <rect x="340" y="78" width="200" height="140" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="440" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#C2410C">CLOUDFLARE</text>

  <!-- Cloudflare Tunnel -->
  <rect x="365" y="112" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="440" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">Cloudflare Tunnel</text>
  <text x="440" y="147" text-anchor="middle" font-size="9" fill="#666">TLS termination</text>
  <text x="440" y="160" text-anchor="middle" font-size="9" fill="#666">Stable public HTTPS URL</text>

  <!-- DNS -->
  <rect x="365" y="182" width="150" height="26" rx="6" fill="#FED7AA" stroke="#F97316" stroke-width="1"/>
  <text x="440" y="199" text-anchor="middle" font-size="10" fill="#92400E">DNS · CDN · DDoS protection</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- ZONE: DEV SERVER (Proxmox) -->
  <!-- ══════════════════════════════════════════════════ -->
  <rect x="340" y="248" width="420" height="360" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="550" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803D">DEVELOPMENT SERVER (Proxmox Home Lab)</text>

  <!-- Linux Container -->
  <rect x="360" y="282" width="380" height="308" rx="10" fill="#DCFCE7" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="550" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Linux Container</text>

  <!-- Nginx / reverse proxy -->
  <rect x="380" y="310" width="160" height="50" rx="7" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.5"/>
  <text x="460" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">Nginx</text>
  <text x="460" y="346" text-anchor="middle" font-size="9" fill="#666">Reverse proxy · HTTPS</text>
  <text x="460" y="358" text-anchor="middle" font-size="9" fill="#666">Certbot TLS cert</text>

  <!-- PM2 + Node -->
  <rect x="560" y="310" width="160" height="50" rx="7" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.5"/>
  <text x="640" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">PM2 + Node</text>
  <text x="640" y="346" text-anchor="middle" font-size="9" fill="#666">Express + Socket.io</text>
  <text x="640" y="358" text-anchor="middle" font-size="9" fill="#666">Game state manager</text>

  <!-- MongoDB -->
  <rect x="380" y="376" width="160" height="60" rx="7" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.5"/>
  <text x="460" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">MongoDB</text>
  <text x="460" y="412" text-anchor="middle" font-size="9" fill="#666">Lobbies · Tail queue</text>
  <text x="460" y="424" text-anchor="middle" font-size="9" fill="#666">Length-trimmed tail entries</text>
  <text x="460" y="436" text-anchor="middle" font-size="9" fill="#666">Session data</text>

  <!-- Cloudflared daemon -->
  <rect x="560" y="376" width="160" height="60" rx="7" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.5"/>
  <text x="640" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">cloudflared</text>
  <text x="640" y="412" text-anchor="middle" font-size="9" fill="#666">Tunnel daemon</text>
  <text x="640" y="424" text-anchor="middle" font-size="9" fill="#666">Outbound only</text>
  <text x="640" y="436" text-anchor="middle" font-size="9" fill="#666">No open router ports</text>

  <!-- GitHub + Cron -->
  <rect x="380" y="452" width="340" height="50" rx="7" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.5"/>
  <text x="550" y="471" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">GitHub Autodeploy (Cron)</text>
  <text x="550" y="487" text-anchor="middle" font-size="9" fill="#666">Poll main branch → git pull → npm install → build → PM2 restart</text>

  <!-- Static build -->
  <rect x="380" y="516" width="340" height="40" rx="7" fill="#BBF7D0" stroke="#22C55E" stroke-width="1"/>
  <text x="550" y="535" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">React PWA Static Build</text>
  <text x="550" y="549" text-anchor="middle" font-size="9" fill="#166534">Served by Nginx — manifest.json · service worker</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- ZONE: EXTERNAL APIS -->
  <!-- ══════════════════════════════════════════════════ -->
  <rect x="790" y="78" width="290" height="240" rx="12" fill="#FDF4FF" stroke="#A855F7" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="935" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#7E22CE">EXTERNAL APIS</text>

  <!-- Mapbox Map Matching -->
  <rect x="815" y="112" width="240" height="64" rx="8" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.5"/>
  <text x="935" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">Mapbox Map Matching API</text>
  <text x="935" y="148" text-anchor="middle" font-size="9" fill="#666">GPS → OSM segment snap</text>
  <text x="935" y="162" text-anchor="middle" font-size="9" fill="#666">Confidence score for on/off graph switch</text>
  <text x="935" y="175" text-anchor="middle" font-size="9" fill="#666">Called server-side only</text>

  <!-- Mapbox Tiles -->
  <rect x="815" y="190" width="240" height="50" rx="8" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.5"/>
  <text x="935" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">Mapbox Tile CDN</text>
  <text x="935" y="226" text-anchor="middle" font-size="9" fill="#666">Map tiles served to client browser</text>
  <text x="935" y="238" text-anchor="middle" font-size="9" fill="#666">OpenStreetMap base data</text>

  <!-- GitHub -->
  <rect x="815" y="254" width="240" height="50" rx="8" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.5"/>
  <text x="935" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">GitHub Repository</text>
  <text x="935" y="290" text-anchor="middle" font-size="9" fill="#666">Source of truth · main branch</text>
  <text x="935" y="302" text-anchor="middle" font-size="9" fill="#666">Autodeploy source for cron job</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- ZONE: PRODUCTION TARGET -->
  <!-- ══════════════════════════════════════════════════ -->
  <rect x="790" y="338" width="290" height="270" rx="12" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="935" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#BE123C">PRODUCTION TARGET</text>
  <text x="935" y="376" text-anchor="middle" font-size="10" fill="#666">(Post-MVP hosting)</text>

  <rect x="815" y="388" width="240" height="50" rx="8" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="935" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">Vercel</text>
  <text x="935" y="424" text-anchor="middle" font-size="9" fill="#666">React PWA frontend</text>
  <text x="935" y="436" text-anchor="middle" font-size="9" fill="#666">GitHub push deploy</text>

  <rect x="815" y="452" width="240" height="50" rx="8" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="935" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">Railway</text>
  <text x="935" y="488" text-anchor="middle" font-size="9" fill="#666">Node/Express + Socket.io backend</text>
  <text x="935" y="500" text-anchor="middle" font-size="9" fill="#666">Managed deployment</text>

  <rect x="815" y="516" width="240" height="50" rx="8" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="935" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A2E">MongoDB Atlas</text>
  <text x="935" y="552" text-anchor="middle" font-size="9" fill="#666">Managed cloud database</text>
  <text x="935" y="564" text-anchor="middle" font-size="9" fill="#666">Same schema as dev</text>

  <rect x="815" y="578" width="240" height="20" rx="4" fill="#FFE4E6" stroke="#F43F5E" stroke-width="1"/>
  <text x="935" y="592" text-anchor="middle" font-size="9" fill="#BE123C">⚠  Sticky sessions required if multi-instance</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- ARROWS + LABELS -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Client ↔ Cloudflare Tunnel (HTTPS + WSS) -->
  <line x1="300" y1="180" x2="365" y2="148" stroke="#6366F1" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="365" y1="155" x2="300" y2="190" stroke="#6366F1" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="328" y="158" font-size="9" fill="#4338CA" font-weight="bold">HTTPS</text>
  <text x="328" y="170" font-size="9" fill="#4338CA">WSS</text>

  <!-- Cloudflare → Nginx -->
  <line x1="440" y1="218" x2="460" y2="310" stroke="#F97316" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="443" y="268" font-size="9" fill="#C2410C">proxy</text>

  <!-- Nginx → PM2/Node -->
  <line x1="540" y1="335" x2="560" y2="335" stroke="#22C55E" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Node → MongoDB -->
  <line x1="600" y1="360" x2="520" y2="376" stroke="#22C55E" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="542" y="372" font-size="9" fill="#15803D">R/W</text>

  <!-- Node → Mapbox Map Matching -->
  <line x1="720" y1="335" x2="815" y2="145" stroke="#A855F7" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="745" y="255" font-size="9" fill="#7E22CE">Map Match</text>
  <text x="745" y="267" font-size="9" fill="#7E22CE">API calls</text>

  <!-- Client → Mapbox Tiles (direct) -->
  <line x1="300" y1="230" x2="815" y2="210" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>
  <text x="540" y="224" font-size="9" fill="#7E22CE">Tile requests (direct)</text>

  <!-- cloudflared → Cloudflare Tunnel (outbound) -->
  <line x1="640" y1="376" x2="515" y2="170" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
  <text x="565" y="280" font-size="9" fill="#C2410C">outbound</text>
  <text x="565" y="292" font-size="9" fill="#C2410C">tunnel</text>

  <!-- GitHub → cron -->
  <line x1="815" y1="280" x2="720" y2="470" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>
  <text x="750" y="390" font-size="9" fill="#7E22CE">git pull</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366F1"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F97316"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22C55E"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#A855F7"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="20" y="660" width="740" height="80" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="40" y="680" font-size="11" font-weight="bold" fill="#1A1A2E">Legend</text>
  <line x1="40" y1="698" x2="80" y2="698" stroke="#6366F1" stroke-width="2"/>
  <text x="88" y="702" font-size="10" fill="#333">HTTPS / WSS (client ↔ server)</text>
  <line x1="220" y1="698" x2="260" y2="698" stroke="#F97316" stroke-width="2"/>
  <text x="268" y="702" font-size="10" fill="#333">Cloudflare proxy / tunnel</text>
  <line x1="420" y1="698" x2="460" y2="698" stroke="#22C55E" stroke-width="2"/>
  <text x="468" y="702" font-size="10" fill="#333">Internal server calls</text>
  <line x1="590" y1="698" x2="630" y2="698" stroke="#A855F7" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="638" y="702" font-size="10" fill="#333">External API calls</text>
  <text x="40" y="726" font-size="10" fill="#666">Dashed zones = logical groupings. Dev Server zone applies during development. Production Target zone replaces it post-MVP.</text>

</svg>
